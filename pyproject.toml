[project]
name = "edgar-intel"
version = "0.1.0"
description = "Retrieval, evaluation, and agent stack over SEC EDGAR filings with XBRL-verifiable ground truth."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "pgvector>=0.2.5",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local embedding + reranking models. Heavy; not needed for CI.
models = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
serving = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]
finetune = [
    "transformers>=4.42",
    "peft>=0.11",
    "datasets>=2.20",
    "accelerate>=0.32",
    "bitsandbytes>=0.43",
    "trl>=0.9",
]
obs = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]
mcp = [
    "mcp>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
edgar-intel = "edgar_intel.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
