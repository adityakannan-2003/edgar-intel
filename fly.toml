# Fly.io deployment.
#
# Two decisions worth being able to defend:
#
# 1. The database is NOT here. Fly's managed Postgres image does not ship
#    pgvector, and this schema opens with `CREATE EXTENSION vector`. Rather than
#    maintain a custom Postgres machine for a portfolio deployment, the DSN
#    points at a managed Postgres that has pgvector already (Neon or Supabase,
#    both free-tier). `docs/DEPLOY.md` has the loading steps.
#
# 2. Always on: one machine, never stopped or suspended. Suspending when idle
#    cost almost nothing, but on 21 Oct a resume from suspend left the machine
#    unreachable for over 8 hours: the app answered Fly's health check from
#    inside while the proxy could not connect, so every public request timed out.
#    A full stop instead costs a 26 s cold start. A link on a resume has to
#    answer, so it is $6.70 a month (docs/DEPLOY.md, Cost).

app = "edgar-intel"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  EDGAR_LLM_PROVIDER = "openai"
  EDGAR_EMBED_PROVIDER = "local"
  EDGAR_SERVICE_NAME = "edgar-intel"
  # Retrieval is free and stays open. /ask spends the key and does not.
  EDGAR_API_RATE_LIMIT_PER_MIN = "20"

# Secrets, set with `fly secrets set` and never in this file:
#   EDGAR_DB_DSN      managed Postgres with pgvector
#   EDGAR_LLM_API_KEY the model key /ask spends
#   EDGAR_API_KEY     the key callers must present to /ask

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    # Liveness. Cheap, and must not depend on Postgres: restarting the process
    # because the database blinked turns a blip into an outage.
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

  [[http_service.checks]]
    # Readiness. Database + index + embedder. The long grace period is the
    # MiniLM load on a cold machine.
    grace_period = "120s"
    interval = "60s"
    method = "GET"
    timeout = "15s"
    path = "/ready"

[[vm]]
  # 1 GB is not padding. MiniLM-L6-v2 plus the ms-marco cross-encoder plus torch
  # CPU runtime does not fit in 512 MB, and the failure mode is an OOM kill
  # partway through the first request rather than a clean error.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
